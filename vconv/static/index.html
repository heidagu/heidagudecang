<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VConv — 视频格式转换</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>VConv <span class="sub">视频转换 · 磁盘镜像</span></h1>
  <nav id="tabs">
    <a href="#convert" id="tab-convert" class="tab active">视频转换</a>
    <a href="#disc" id="tab-disc" class="tab">磁盘镜像</a>
  </nav>
  <div id="ffmpeg-box" class="ffmpeg-box">
    <span id="ffmpeg-chip" class="chip">检测中…</span>
    <button id="btn-recheck" class="btn small">重新检测</button>
    <button id="btn-download" class="btn small primary" hidden>一键下载 ffmpeg</button>
    <button id="btn-manual" class="btn small">手动指定路径…</button>
    <button id="btn-clear-manual" class="btn small" hidden>清除指定路径</button>
    <span id="dl-progress" class="muted"></span>
  </div>
</header>

<main>
  <!-- 页面一：视频转换 -->
  <section id="page-convert" class="page">
  <div id="convert-layout">
  <!-- 左侧：任务 -->
  <section id="jobs-panel">
    <h2>转换任务 <span id="job-count" class="muted"></span></h2>
    <div id="jobs"></div>
    <p id="jobs-empty" class="empty">还没有任务。右侧选择文件后点击「开始转换」。</p>
    <details id="history-box">
      <summary>历史记录</summary>
      <ul id="history"></ul>
    </details>
  </section>

  <!-- 右侧：设置与文件 -->
  <section id="settings-panel">
    <div class="card">
      <h2>转换设置</h2>
      <fieldset id="video-fs">
        <div class="row">
          <label>视频编码
            <select id="codec">
              <optgroup label="常用格式">
                <option value="h264">H.264（兼容性最好）</option>
                <option value="h265">H.265 / HEVC（省空间）</option>
                <option value="av1">AV1（新一代编码）</option>
                <option value="vp9">VP9（WebM 推荐）</option>
                <option value="copy">不转码（仅改封装/音频）</option>
              </optgroup>
              <optgroup label="更多格式">
                <option value="mpeg4">MPEG-4（老设备兼容）</option>
                <option value="mpeg2video">MPEG-2（DVD / TS 流）</option>
                <option value="vp8">VP8（WebM 旧编码）</option>
                <option value="prores">ProRes（专业剪辑）</option>
                <option value="mjpeg">MJPEG（逐帧 JPEG）</option>
              </optgroup>
            </select>
          </label>
          <label>封装容器
            <select id="container">
              <option value="">跟随源文件</option>
              <optgroup label="常用格式">
                <option value="mp4">MP4</option>
                <option value="mkv">MKV</option>
                <option value="mov">MOV</option>
                <option value="webm">WebM</option>
              </optgroup>
              <optgroup label="更多格式">
                <option value="avi">AVI</option>
                <option value="flv">FLV</option>
                <option value="m4v">M4V</option>
                <option value="ts">TS</option>
              </optgroup>
            </select>
          </label>
        </div>
        <div class="row">
          <label>帧率
            <select id="fps">
              <option value="source">保持原帧率</option>
              <option value="23.976">23.976</option>
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="60">60</option>
              <option value="custom">自定义…</option>
            </select>
          </label>
          <label id="custom-fps-label" hidden>自定义帧率
            <input type="number" id="custom-fps" min="1" max="120" step="0.01" value="30">
          </label>
        </div>
        <div class="row">
          <label>分辨率
            <select id="resolution">
              <option value="source">保持原分辨率</option>
              <option value="4k">4K（2160p）</option>
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="custom">自定义…</option>
            </select>
          </label>
          <span id="custom-res-label" class="row" hidden>
            <input type="number" id="custom-w" min="2" max="8192" placeholder="宽" value="1920">
            ×
            <input type="number" id="custom-h" min="2" max="8192" placeholder="高" value="1080">
          </span>
        </div>
      </fieldset>

      <fieldset id="quality-fs">
        <legend>画质</legend>
        <div class="radio-row">
          <label id="qm-crf-label"><input type="radio" name="qm" value="crf" checked> 画质优先（CRF）</label>
          <label id="qm-qscale-label"><input type="radio" name="qm" value="qscale"> 质量档位</label>
          <label id="qm-bitrate-label"><input type="radio" name="qm" value="bitrate"> 固定码率</label>
          <label class="check"><input type="checkbox" id="two-pass"> 两遍编码</label>
        </div>
        <div id="crf-box" class="row">
          <span class="muted">低质量</span>
          <input type="range" id="crf">
          <span class="muted">高质量</span>
          <b id="crf-val"></b>
        </div>
        <div id="qscale-box" class="row" hidden>
          <span class="muted">高质量</span>
          <input type="range" id="qscale" min="2" max="31" value="5">
          <span class="muted">低质量</span>
          <b id="qscale-val"></b>
          <span class="muted">（数值越小越清晰）</span>
        </div>
        <div id="bitrate-box" class="row" hidden>
          <input type="text" id="bitrate" list="bitrate-opts" value="6M">
          <datalist id="bitrate-opts">
            <option value="2M"><option value="4M"><option value="6M">
            <option value="8M"><option value="12M"><option value="20M">
          </datalist>
          <span class="muted">如 6M 或 800k</span>
        </div>
        <div id="prores-box" class="row" hidden>
          <label>ProRes 质量档位
            <select id="prores-profile">
              <option value="proxy">Proxy（代理剪辑，体积最小）</option>
              <option value="lt">LT（轻量）</option>
              <option value="standard" selected>Standard（标准）</option>
              <option value="hq">HQ（高质量）</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="hw"> 硬件加速</label>
          <select id="hw-quality" hidden>
            <option value="high">高质量</option>
            <option value="medium" selected>均衡</option>
            <option value="low">速度快</option>
          </select>
          <span id="hw-info" class="muted"></span>
        </div>
      </fieldset>

      <fieldset id="audio-fs">
        <legend>音频</legend>
        <div class="row">
          <label>音频处理
            <select id="audio">
              <optgroup label="常用格式">
                <option value="copy">原样复制（不转码）</option>
                <option value="aac">转 AAC</option>
                <option value="opus">转 Opus</option>
                <option value="mp3">转 MP3</option>
                <option value="none">静音（去掉音频）</option>
                <option value="extract">仅提取音频</option>
              </optgroup>
              <optgroup label="更多格式">
                <option value="flac">转 FLAC（无损）</option>
                <option value="ac3">转 AC-3</option>
              </optgroup>
            </select>
          </label>
          <label id="audio-bitrate-label">码率
            <input type="text" id="audio-bitrate" value="192k" size="6">
          </label>
          <label id="extract-ext-label" hidden>格式
            <select id="extract-ext">
              <option value="m4a">M4A (AAC)</option>
              <option value="opus">Opus</option>
              <option value="mp3">MP3</option>
              <option value="wav">WAV（无损）</option>
              <option value="flac">FLAC（无损）</option>
              <option value="ac3">AC-3</option>
            </select>
          </label>
        </div>
        <p id="audio-warning" class="warn" hidden></p>
      </fieldset>
    </div>

    <div class="card">
      <h2>输出设置</h2>
      <div class="row">
        <label class="grow">输出目录
          <input type="text" id="outdir" placeholder="留空 = 与源文件同目录">
        </label>
        <button id="btn-pick-outdir" class="btn small">选择目录…</button>
      </div>
      <div class="row">
        <label>并发任务数
          <input type="number" id="workers" min="1" max="32" value="0">
        </label>
        <span class="muted">0 = 自动（CPU 核心数 − 1）</span>
        <button id="btn-save-settings" class="btn small">保存设置</button>
      </div>
    </div>

    <div class="card">
      <h2>文件</h2>
      <div class="row">
        <button id="btn-add-files" class="btn primary">添加视频文件…</button>
        <details class="muted">
          <summary>或手动输入路径</summary>
          <textarea id="paste-paths" rows="3" placeholder="每行一个文件路径"></textarea>
          <button id="btn-add-pasted" class="btn small">添加</button>
        </details>
      </div>
      <ul id="files"></ul>
      <button id="btn-start" class="btn primary big">开始转换</button>
    </div>
  </section>
  </div>
  </section>

  <!-- 页面二：磁盘镜像 -->
  <section id="page-disc" class="page" hidden>
    <div class="card">
      <h2>磁盘镜像 <span class="sub">文件夹 ↔ 镜像</span></h2>
      <div class="radio-row">
        <label><input type="radio" name="disc-mode" value="pack" checked> 文件夹 → 镜像</label>
        <label><input type="radio" name="disc-mode" value="extract"> 提取镜像内容</label>
      </div>
      <div id="disc-pack">
        <div class="row">
          <label class="grow">源文件夹
            <input type="text" id="disc-src" placeholder="点击右侧按钮选择文件夹" readonly>
          </label>
          <button id="btn-disc-pick-src" class="btn small">选择文件夹…</button>
        </div>
        <div class="row">
          <label class="grow">输出目录
            <input type="text" id="disc-outdir" placeholder="留空 = 源文件夹所在目录">
          </label>
          <button id="btn-disc-pick-out" class="btn small">选择…</button>
        </div>
        <button id="btn-disc-pack" class="btn primary">开始打包为 ISO</button>
      </div>
      <div id="disc-extract" hidden>
        <div class="row">
          <label class="grow">镜像文件
            <input type="text" id="disc-img" placeholder="ISO / IMG 文件" readonly>
          </label>
          <button id="btn-disc-pick-img" class="btn small">选择镜像…</button>
        </div>
        <div class="row">
          <label class="grow">提取到目录
            <input type="text" id="disc-dest" placeholder="留空 = 镜像旁边自动建「xxx-提取」文件夹">
          </label>
          <button id="btn-disc-pick-dest" class="btn small">选择…</button>
        </div>
        <button id="btn-disc-extract" class="btn primary">开始提取</button>
      </div>
      <p id="disc-cap" class="muted"></p>
      <div id="disc-tasks"></div>
    </div>
  </section>
</main>

<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
